<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Stabilife</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-illustration">
      <div class="brand-row">
        <div class="brand-mark">X</div>
        <span>Stabilife</span>
      </div>

      <h1>Welcome back to your social world.</h1>
      <p>
        Sign in to stay connected with your network, discover new ideas, and keep the conversation going.
      </p>

      <ul class="feature-list">
        <li><span class="feature-icon">✓</span> Follow trending conversations</li>
        <li><span class="feature-icon">✓</span> Post updates in seconds</li>
        <li><span class="feature-icon">✓</span> Manage your profile with ease</li>
      </ul>
    </div>

    <div class="auth-card">
      <div class="auth-logo">X</div>
      <h2>Login</h2>

      <form>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter your password" />
        </div>

        <div class="auth-actions">
          <button class="primary-btn" type="button" onclick="window.location.href='main.html'">Login</button>
          <button class="secondary-btn" type="button" onclick="window.location.href='register.html'">Register</button>
        </div>
      </form>

      <div class="auth-links">
        <span>Don’t have an account?</span>
        <a href="register.html">Create one</a>
      </div>
    </div>
  </div>
</body>
</html>
